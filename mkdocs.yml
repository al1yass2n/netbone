site_name: Netbone
site_description: Extract, evaluate, and reproduce network backbones with Python or the local web app.
site_url: !ENV NETBONE_DOCS_SITE_URL
repo_name: GitHub
repo_url: https://github.com/al1yass2n/netbone
edit_uri: ''

theme:
  name: mkdocs
  highlightjs: false

nav:
  - Home: index.md
  - Start:
      - Install Netbone: start/install.md
      - Extract your first backbone: start/first-backbone.md
  - Python:
      - Prepare network inputs: python/inputs.md
      - Aggregate temporal interactions: python/temporal.md
      - Choose what to keep: python/select.md
      - Compare backbone results: python/compare.md
      - Find settings with a sweep: python/sweep.md
      - Save and reproduce an analysis: python/reproduce.md
  - Browser:
      - Try the web demo: browser/sample-demo.md
      - Run the local web app: browser/launch.md
      - Extract a backbone in the browser: browser/first-session.md
      - Import a network: browser/import.md
      - Compare and sweep: browser/evaluate.md
  - Methods:
      - Method catalog: reference/methods.md
      - Edge Weight: methods/edge_weight.md
      - Edge Betweenness: methods/edge_betweenness.md
      - Disparity: methods/disparity.md
      - Locally Adaptive Network Sparsification: methods/lans.md
      - Link Salience: methods/link_salience.md
      - Link Prediction: methods/link_prediction.md
      - Link Prediction Isolation Forest: methods/link_prediction_iforest.md
      - GSPAR: methods/gspar.md
      - Maximum Spanning Forest: methods/maximum_spanning_forest.md
      - Primary Linkage: methods/primary_linkage.md
      - Multiple Linkage: methods/multiple_linkage.md
      - Planar Maximally Filtered Graph: methods/planar_maximally_filtered_graph.md
      - H-Backbone: methods/h_backbone.md
      - Doubly Stochastic: methods/doubly_stochastic.md
      - Marginal Likelihood: methods/marginal_likelihood.md
      - Noise Corrected: methods/noise_corrected.md
      - Globally and Locally Adaptive Network Backbone: methods/glanb.md
      - Node Degree: methods/node_degree.md
      - Node Strength: methods/node_strength.md
      - Node Betweenness: methods/node_betweenness.md
  - Reference:
      - Pipelines and results: reference/pipelines.md
      - Networks and loaders: reference/networks.md
      - Comparison, sweeps, and exports: reference/measurement.md
      - Temporal input and aggregation: reference/temporal.md
      - Registry discovery: reference/registry.md
      - Threshold: filters/threshold.md
      - Fraction: filters/fraction.md
      - Significance: filters/significance.md
      - Method default: filters/default.md
  - Project:
      - Troubleshooting: help.md
      - Develop and publish the documentation: develop.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_root_heading: true
            show_root_full_path: false
            show_object_full_path: false
            show_source: false
            filters: ["!^_"]

markdown_extensions:
  - attr_list
  - fenced_code
  - md_in_html
  - toc:
      permalink: true
  - codehilite:
      guess_lang: false
      noclasses: true
      pygments_style: friendly

extra_css:
  - assets/docs.css
extra_javascript:
  - assets/copy-code.js

validation:
  nav:
    omitted_files: warn
  links:
    anchors: warn
    unrecognized_links: warn
